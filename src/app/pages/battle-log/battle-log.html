<div class="battle-container">
    <!-- <app-sidebar></app-sidebar> -->
  <div class="dashboard-grid">
    <mat-card>
      <mat-card-header>
        <mat-card-title>Historical Battle Data</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <table mat-table [dataSource]="battles()" class="mat-elevation-z8">
          <ng-container matColumnDef="opponent">
            <th mat-header-cell *matHeaderCellDef> Opponent </th>
            <td mat-cell *matCellDef="let b"> {{b.opponent_name}} </td>
          </ng-container>

          <ng-container matColumnDef="result">
            <th mat-header-cell *matHeaderCellDef> Result </th>
            <td mat-cell *matCellDef="let b">
              <mat-chip [ngClass]="b.result === 'win' ? 'win-badge' : 'loss-badge'">
                {{b.result | uppercase}}
              </mat-chip>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="['opponent', 'result']"></tr>
          <tr mat-row *matRowDef="let row; columns: ['opponent', 'result'];"></tr>
        </table>
      </mat-card-content>
    </mat-card>

    <!-- Live Terminal -->
    <mat-card>
      <mat-card-header>
        <mat-card-title>Live Combat Feed</mat-card-title>
      </mat-card-header>
      <mat-card-content>
        <div class="terminal-box">
          @for (log of logs(); track log.id) {
            <div class="log-entry" [ngClass]="log.severity">
              [{{log.timestamp | date:'HH:mm:ss'}}] {{log.message}}
            </div>
          } @empty {
            <div>Waiting for stream...</div>
          }
        </div>
      </mat-card-content>
    </mat-card>
  </div>
</div>
