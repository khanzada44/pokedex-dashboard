<div class="battle-container">
    <div class="dashboard-grid">
        <mat-card appearance="outlined">
            <mat-card-header>
                <mat-card-title>Historical Battle Data</mat-card-title>
            </mat-card-header>
            <mat-card-content>
                <div class="table-wrapper">
                    <table mat-table [dataSource]="battles()" class="mat-elevation-z0">
                        <ng-container matColumnDef="opponent">
                            <th mat-header-cell *matHeaderCellDef> Opponent </th>
                            <td mat-cell *matCellDef="let b"> {{b.opponent_name}} </td>
                        </ng-container>

                        <ng-container matColumnDef="result">
                            <th mat-header-cell *matHeaderCellDef> Result </th>
                            <td mat-cell *matCellDef="let b">
                                <mat-chip-set>
                                    <mat-chip [ngClass]="b.result === 'win' ? 'win-badge' : 'loss-badge'">
                                        {{b.result | uppercase}}
                                    </mat-chip>
                                </mat-chip-set>
                            </td>
                        </ng-container>

                        <tr mat-header-row *matHeaderRowDef="['opponent', 'result']"></tr>
                        <tr mat-row *matRowDef="let row; columns: ['opponent', 'result'];"></tr>
                    </table>
                </div>
            </mat-card-content>
        </mat-card>

        <mat-card appearance="outlined">
            <mat-card-header>
                <mat-card-title>Live Combat Feed</mat-card-title>
            </mat-card-header>

            <mat-card-content>
                <div class="actions" style="margin-bottom: 10px;">
                    <button mat-flat-button color="primary" (click)="startTestBattle()">
                        Start New Battle
                    </button>
                </div>

                <div class="terminal-box">
                    @for (log of liveLogs(); track log.id) {
                    <div class="log-entry" [ngClass]="log.severity">
                        <span class="timestamp">[{{log.timestamp | date:'HH:mm:ss'}}]</span>
                        {{log.message}}
                    </div>
                    } @empty {
                    <div class="empty-state">Waiting for stream...</div>
                    }
                </div>
            </mat-card-content>
        </mat-card>
    </div>
</div>
